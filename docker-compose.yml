version: "3.9"

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: light_db
    environment:
      POSTGRES_USER: light
      POSTGRES_PASSWORD: light
      POSTGRES_DB: light_grants
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U light -d light_grants"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: light_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: light_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://light:light@db:5432/light_grants
      REDIS_URL: redis://redis:6379/0
      ONLYOFFICE_URL: http://localhost:8080
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_BACKEND_URL: http://backend:8000
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker (bulk: discovery, enrichment, scoring, summaries) ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: light_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://light:light@db:5432/light_grants
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --queues=celery,summaries,scans,scan_now
      --loglevel=info
      --concurrency=4
      --hostname=worker@%h

  # ── Celery Worker (call analysis — dedicated, never starved) ──────────
  call_analysis_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: light_call_analysis_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://light:light@db:5432/light_grants
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --queues=call_analysis
      --loglevel=info
      --concurrency=2
      --hostname=call_analysis@%h

  # ── Celery Beat (scheduler) ───────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: light_beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql://light:light@db:5432/light_grants
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./backend:/app
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ── Steel Browser ─────────────────────────────────────────
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: light_steel
    ports:
      - "3001:3000"   # Steel REST API (backend calls this internally)
      - "5173:5173"   # Steel session viewer / WebRTC stream (browser accesses this)
    shm_size: "2gb"
    restart: unless-stopped

  # ── OnlyOffice Document Server (co-editing budget workbooks) ──
  # Edits .xlsx/.xlsm natively so formatting and VBA macros survive. Fetches
  # files from and posts saves to the backend; JWT secret must match
  # ONLYOFFICE_JWT_SECRET on the backend.
  onlyoffice:
    image: onlyoffice/documentserver:8.3
    container_name: light_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-local-onlyoffice-secret}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: light_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
